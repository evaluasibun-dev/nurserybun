<html lang="id">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
:root{
  --bg:#F3F6F2; --panel:#FFFFFF; --ink:#18261D; --muted:#5A6A5F; --line:#D6DFD7;
  --leaf:#1F6B45; --leaf-ink:#FFFFFF; --soft:#E6EEE7; --focus:#E0A100;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --panel:#16211A; --ink:#E4ECE6; --muted:#9AAA9F; --line:#2A3A30;
  --leaf:#4FB07E; --leaf-ink:#0B1A11; --soft:#1E2C23; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:400px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
.head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.head h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.stat{display:flex;gap:18px;margin-top:12px}
.stat div{display:flex;flex-direction:column}
.stat b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.filters{padding:14px 20px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=search],select{font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px 5px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.chip[aria-pressed="false"]{opacity:.5}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.list{overflow:auto;flex:1;min-height:0;padding:4px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;padding:11px 20px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.item:hover{background:var(--soft)}
.item i{width:12px;height:12px;border-radius:50%;margin-top:4px}
.item b{font-weight:700;font-size:14.5px}
.item small{display:block;color:var(--muted);font-size:12.5px}
.item em{font-style:normal;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--muted)}
.empty{padding:28px 20px;color:var(--muted)}
.more{margin:12px 20px}
#map{height:100%;width:100%}
.mapwrap{position:relative;min-height:0}
.toggle{display:none}
/* popup */
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:14px 16px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:13.5px;line-height:1.45;min-width:240px}
.pp h3{margin:0 0 2px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
.pp h3 i{width:12px;height:12px;border-radius:50%}
.pp .loc{color:#4b5a50;margin-bottom:8px}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 10px}
.pp dt{color:#6b7a70}.pp dd{margin:0;font-weight:600;word-break:break-word}
.pp .acts{display:flex;gap:6px;flex-wrap:wrap}
.pp a.go{background:#1F6B45;color:#fff;text-decoration:none;font-weight:700;border-radius:9px;padding:8px 12px}
.pp a.alt,.pp button{background:#EEF3EF;color:#18261D;text-decoration:none;font:inherit;font-weight:600;border:0;border-radius:9px;padding:8px 10px;cursor:pointer}
.cl{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:#1F6B45;border:3px solid rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(0,0,0,.35);font-family:"Plus Jakarta Sans",sans-serif}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr}
  aside{position:fixed;left:0;right:0;bottom:0;height:72%;z-index:1000;border-right:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(calc(100% - 64px - env(safe-area-inset-bottom,0px)));transition:transform .25s ease;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-top:0}
  aside.open{transform:none}
  .toggle{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-weight:700;font-size:15px;background:none;border:0;color:var(--ink);padding:14px 20px;min-height:64px;cursor:pointer;border-bottom:1px solid var(--line)}
  .toggle span{color:var(--muted);font-weight:600;font-size:13px}
  .head{padding-top:12px}
  .mapwrap{height:100%}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>

const COLORS={"Tebu":"#5E8C1A","Kakao":"#9C4A22","Kopi":"#3B2A20","Kelapa":"#1E7F8C","Jambu Mete":"#D98E04","Lada":"#B3263A","Pala":"#7A3E9D"};
const fmt=n=>n.toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dirURL=r=>`https://www.google.com/maps/dir/?api=1&destination=${r.la},${r.lo}&travelmode=driving`;
const viewURL=r=>`https://www.google.com/maps/search/?api=1&query=${r.la},${r.lo}`;
DATA.forEach((r,i)=>{r.id=i;r.txt=[r.d,r.kc,r.kb,r.p,r.py,r.nk,r.pk,r.k,r.j].join(' ').toLowerCase();});

const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([-2.3,118],5);
const jalan=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri World Imagery'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
L.control.layers({'Peta jalan':jalan,'Citra satelit':sat,'OpenStreetMap':osm},null,{position:'topright'}).addTo(map);

const cluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:45,spiderfyOnMaxZoom:true,
  iconCreateFunction:c=>{const n=c.getChildCount();const s=n<10?34:n<50?40:n<200?48:56;
    return L.divIcon({html:`<div class="cl" style="width:${s}px;height:${s}px">${n}</div>`,className:'',iconSize:[s,s]});}});
map.addLayer(cluster);

function popup(r){const c=COLORS[r.k]||'#1F6B45';
  return `<div class="pp"><h3><i style="background:${c}"></i>${esc(r.k)}${r.j&&r.j.toLowerCase()!==r.k.toLowerCase()?' <span style="font-weight:600;font-size:13px;color:#6b7a70">'+esc(r.j)+'</span>':''}</h3>
  <div class="loc">Desa ${esc(r.d)}, Kec. ${esc(r.kc)}<br>${esc(r.kb)}, ${esc(r.p)}</div>
  <dl><dt>Benih</dt><dd>${fmt(r.b)} batang</dd><dt>Penyedia</dt><dd>${esc(r.py)}</dd><dt>Kontrak</dt><dd>${esc(r.nk)}<br><span style="font-weight:500">${esc(r.tg)}</span></dd><dt>Satker</dt><dd>${esc(r.s)}</dd><dt>Koordinat</dt><dd>${r.la}, ${r.lo}</dd></dl>
  <div class="acts"><a class="go" href="${dirURL(r)}" target="_blank" rel="noopener">Petunjuk arah</a><a class="alt" href="${viewURL(r)}" target="_blank" rel="noopener">Buka di Google Maps</a><button onclick="copyC(${r.la},${r.lo},this)">Salin koordinat</button></div></div>`;}
window.copyC=(a,b,el)=>{navigator.clipboard?.writeText(a+', '+b).then(()=>{el.textContent='Tersalin';setTimeout(()=>el.textContent='Salin koordinat',1500)});};

const markers=DATA.map(r=>L.circleMarker([r.la,r.lo],{radius:8,color:'#fff',weight:2,fillColor:COLORS[r.k]||'#1F6B45',fillOpacity:.95}).bindPopup(()=>popup(r),{maxWidth:320}));

// filters
const $=id=>document.getElementById(id);
const uniq=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y,'id'));
const komList=Object.keys(COLORS).filter(k=>DATA.some(r=>r.k===k));
const active=new Set(komList);
let me=null, shown=200;
function fillSel(el,vals,all){const cur=el.value;el.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('');if(vals.includes(cur))el.value=cur;}
fillSel($('prov'),uniq(DATA.map(r=>r.p)),'Semua provinsi');
fillSel($('satker'),uniq(DATA.map(r=>r.s)),'Semua satker');
function fillKab(){const p=$('prov').value;fillSel($('kab'),uniq(DATA.filter(r=>!p||r.p===p).map(r=>r.kb)),'Semua kabupaten');}
fillKab();
$('chips').innerHTML=komList.map(k=>{const n=DATA.filter(r=>r.k===k).length;return `<button class="chip" style="--c:${COLORS[k]}" aria-pressed="true" data-k="${esc(k)}"><i></i>${esc(k)} <span style="color:var(--muted);font-weight:500">${n}</span></button>`}).join('');
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.k;
  if(e.detail===2){/*dblclick handled below*/}
  if(active.has(k)&&active.size===komList.length){active.clear();active.add(k);}       // first click isolates
  else if(active.has(k)){active.delete(k);if(!active.size)komList.forEach(x=>active.add(x));}
  else active.add(k);
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',active.has(c.dataset.k)));apply(true);});

const dist=(a,b,c,d)=>{const R=6371,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
let cur=[];
function apply(fit){
  const q=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean), p=$('prov').value,kb=$('kab').value,s=$('satker').value;
  cur=DATA.filter(r=>active.has(r.k)&&(!p||r.p===p)&&(!kb||r.kb===kb)&&(!s||r.s===s)&&q.every(w=>r.txt.includes(w)));
  if(me){cur.forEach(r=>r.km=dist(me[0],me[1],r.la,r.lo));cur.sort((a,b)=>a.km-b.km);} else cur.sort((a,b)=>a.p.localeCompare(b.p,'id')||a.kb.localeCompare(b.kb,'id')||a.k.localeCompare(b.k));
  cluster.clearLayers();cluster.addLayers(cur.map(r=>markers[r.id]));
  $('sTitik').textContent=fmt(cur.length);$('sBenih').textContent=fmt(cur.reduce((a,r)=>a+r.b,0));$('sKab').textContent=fmt(new Set(cur.map(r=>r.kb)).size);
  $('tcount').textContent=fmt(cur.length)+' titik';
  shown=200;renderList();
  if(fit&&cur.length){const b=L.latLngBounds(cur.map(r=>[r.la,r.lo]));map.fitBounds(b,{padding:[40,40],maxZoom:13});}
}
function renderList(){
  const L2=$('list');if(!cur.length){L2.innerHTML='<div class="empty">Tidak ada lokasi yang cocok. Coba hapus kata kunci atau pilih semua komoditas.</div>';return;}
  L2.innerHTML=cur.slice(0,shown).map(r=>`<button class="item" role="listitem" data-id="${r.id}"><i style="background:${COLORS[r.k]}"></i><span><b>${esc(r.k)} · Desa ${esc(r.d)}</b><small>Kec. ${esc(r.kc)}, ${esc(r.kb)}, ${esc(r.p)}</small><small>${esc(r.py)}</small></span><em>${me?r.km.toFixed(0)+' km':fmt(r.b)}</em></button>`).join('')
   +(cur.length>shown?`<button class="btn more" id="more">Tampilkan ${fmt(Math.min(200,cur.length-shown))} lagi dari ${fmt(cur.length-shown)}</button>`:'');
}
$('list').addEventListener('click',e=>{
  if(e.target.id==='more'){shown+=200;renderList();return;}
  const it=e.target.closest('.item');if(!it)return;const r=DATA[+it.dataset.id],m=markers[r.id];
  if(innerWidth<=820)setOpen(false);
  cluster.zoomToShowLayer(m,()=>{map.setView([r.la,r.lo],Math.max(map.getZoom(),14));m.openPopup();});
});
let tm;$('q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>apply(true),250);});
$('prov').addEventListener('change',()=>{fillKab();$('kab').value='';apply(true);});
$('kab').addEventListener('change',()=>apply(true));
$('satker').addEventListener('change',()=>apply(true));
$('reset').addEventListener('click',()=>{$('q').value='';$('prov').value='';fillKab();$('satker').value='';komList.forEach(k=>active.add(k));document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','true'));apply(true);});
let meMk=null;
$('near').addEventListener('click',()=>{
  if(me){me=null;$('near').textContent='Urutkan dari lokasi saya';$('near').classList.remove('primary');if(meMk){map.removeLayer(meMk);meMk=null;}apply(false);return;}
  if(!navigator.geolocation){alert('Browser ini tidak mendukung lokasi.');return;}
  $('near').textContent='Mencari lokasi…';
  navigator.geolocation.getCurrentPosition(pos=>{me=[pos.coords.latitude,pos.coords.longitude];
    meMk=L.marker(me,{icon:L.divIcon({html:'<div class="me"></div>',className:'',iconSize:[16,16]})}).addTo(map).bindTooltip('Lokasi Anda');
    $('near').textContent='Urutan terdekat aktif (matikan)';$('near').classList.add('primary');apply(false);map.setView(me,9);},
   ()=>{$('near').textContent='Urutkan dari lokasi saya';alert('Lokasi tidak bisa diambil. Izinkan akses lokasi di browser, lalu coba lagi.');},{enableHighAccuracy:true,timeout:15000});
});
function setOpen(o){$('panel').classList.toggle('open',o);$('toggle').setAttribute('aria-expanded',o);}
$('toggle').addEventListener('click',()=>setOpen(!$('panel').classList.contains('open')));
apply(false);
</script>
</body>
</html>
